<!doctype html><html><body style="font-family:-apple-system,Helvetica;background:#fafafa;margin:0;padding:40px">
<div id="card" style="width:380px;margin:auto;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:24px">
<h2 style="margin:0 0 24px;font-size:20px">Invite teammates</h2>
<label style="font-size:13px;color:#666">Email</label>
<input id="email" style="display:block;width:100%;box-sizing:border-box;margin-top:20px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px" placeholder="name@company.com">
<p id="err" style="color:#d1242f;font-size:13px;margin-top:40px">Enter a valid email</p>
<div style="display:flex;gap:8px;margin-top:16px"><button id="send" style="padding:10px 16px;background:#111;color:#fff;border:0;border-radius:8px">Send invite</button><button id="cancel" style="padding:10px 16px;background:#fff;border:1px solid #ddd;border-radius:8px">Cancel</button></div>
</div></body></html>
