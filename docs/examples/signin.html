<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 48px; background: #f4f4f5; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #18181b; }
  #form { width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; background: #fff; border: 1px solid #e4e4e7; border-radius: 10px; font-size: 16px; font-weight: 500; }
  .btn svg { width: 18px; height: 18px; }
  .row { display: flex; gap: 12px; }
  .row .btn { flex: 1; }
  label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #52525b; margin-top: 4px; }
  label svg { width: 15px; height: 15px; }
  input { height: 48px; padding: 0 14px; border: 1.5px solid #ef4444; border-radius: 10px; font-size: 16px; box-shadow: 0 0 0 3px #fee2e2; outline: none; }
  #error { display: flex; align-items: center; gap: 8px; color: #dc2626; font-size: 15px; margin: -2px 0 4px; }
  #error svg { width: 17px; height: 17px; }
</style>
</head>
<body>
  <div id="form">
    <div class="btn" id="openai">ChatGPT</div>
    <label id="slug">Team Slug
      <svg id="info" viewBox="0 0 16 16" fill="none" stroke="#52525b" stroke-width="1.4"><circle cx="8" cy="8" r="6.5"/><path d="M8 7v4M8 4.8v.1"/></svg>
    </label>
    <input placeholder="my-team">
    <div id="error">
      <svg viewBox="0 0 16 16" fill="none" stroke="#dc2626" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v4.2M8 10.8v.1"/></svg>
      <span id="error-text">Team slug is required.</span>
    </div>
    <div class="btn" id="sso">
      <svg id="lock" viewBox="0 0 16 16" fill="none" stroke="#18181b" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
      Continue with SAML SSO
    </div>
    <div class="row">
      <div class="btn">Passkey</div>
      <div class="btn">Apple</div>
    </div>
  </div>
</body>
</html>
