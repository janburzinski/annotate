name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # dwebp, so the WebP conversion path is tested as well.
      - run: sudo apt-get update -q && sudo apt-get install -y -q webp
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The runner ships Google Chrome, so the page-capture tests run too.
      - run: bun test

  # The landing page runs the CLI's layout engine in the browser, so build it on every change.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
